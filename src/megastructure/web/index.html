<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Megastructure</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#07090b; --panel:#0e1215; --line:#1c2328; --text:#c9d1d6; --dim:#6b7780; --accent:#4fd1c5; --warn:#e8a33d; --bad:#e5534b; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; overflow:hidden; }
  #app { display:grid; grid-template-columns: 1fr 340px; height:100vh; }
  #view { position:relative; overflow:hidden; cursor:grab; }
  #view.drag { cursor:grabbing; }
  canvas { display:block; image-rendering: pixelated; }
  #hud { position:absolute; left:12px; top:10px; pointer-events:none; text-shadow:0 1px 2px #000; }
  #hud .title { font-size:15px; letter-spacing:.25em; color:var(--accent); }
  #hud .sub { color:var(--dim); }
  #tip { position:absolute; pointer-events:none; background:#000c; border:1px solid var(--line);
    padding:4px 7px; border-radius:4px; display:none; white-space:nowrap; }
  #side { background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  section { border-bottom:1px solid var(--line); padding:10px 12px; }
  h2 { margin:0 0 6px; font-size:11px; letter-spacing:.18em; color:var(--dim); font-weight:600; text-transform:uppercase; }
  #agents div { padding:2px 4px; border-radius:3px; cursor:pointer; display:flex; justify-content:space-between; }
  #agents div:hover, #agents div.sel { background:#16202a; }
  #agents .off { color:var(--dim); }
  #log { flex:1; overflow-y:auto; padding:8px 12px; min-height:0; }
  #log div { padding:1px 0; border-bottom:1px solid #12171b; }
  .t { color:var(--dim); margin-right:6px; }
  .say { color:#9ad1ff; } .shout { color:#ffd479; } .death { color:var(--bad); } .attack { color:#ff8f6b; }
  .give { color:#9be38a; } .craft { color:#b9a6ff; } .join, .leave { color:var(--dim); } .sign { color:#e7d3a1; }
  input, button { font:inherit; background:#0a0e11; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:5px 7px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  .row { display:flex; gap:6px; margin-top:6px; }
  .row input { flex:1; min-width:0; }
  #me { white-space:pre-wrap; color:var(--text); }
  .bar { height:5px; background:#1a2126; border-radius:3px; margin:2px 0 5px; }
  .bar i { display:block; height:100%; border-radius:3px; }
  #keys { color:var(--dim); font-size:11px; margin-top:6px; }
  #result { color:var(--dim); margin-top:4px; min-height:1.4em; word-break:break-word; }
  #metrics { color:var(--dim); font-size:11px; }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="c"></canvas>
    <div id="hud"><div class="title">MEGASTRUCTURE</div><div class="sub" id="clock">connecting…</div></div>
    <div id="tip"></div>
  </div>
  <div id="side">
    <section>
      <h2>Play</h2>
      <div id="login">
        <div class="row"><input id="name" placeholder="your name" maxlength="24"><button id="join">Enter</button></div>
      </div>
      <div id="play" style="display:none">
        <div id="me"></div>
        <div class="row"><input id="cmd" placeholder="craft recipe=bench · say text=hi · move_to x=3 y=4"><button id="send">Do</button></div>
        <div id="result"></div>
        <div id="keys">WASD/arrows step · Shift+dir dig · F pick up · R rest · T say · Enter command · click tile = walk there</div>
      </div>
    </section>
    <section>
      <h2>Agents</h2>
      <div id="agents"></div>
    </section>
    <section><div id="metrics"></div></section>
    <h2 style="padding:10px 12px 0">Events</h2>
    <div id="log"></div>
  </div>
</div>
<script>
const COLORS = {
  // ground
  "~": ["#0f3b44", null], ":": ["#2a3236", "#3a454b"], ".": ["#1d2a1f", null], ",": ["#1b2024", null],
  "o": ["#0b0d0f", "#000"], "_": ["#2c3338", "#3c464d"], "'": ["#241c18", null], "=": ["#000000", null],
  // blocks
  "T": ["#1b2024", "#8a5a3b"], "b": ["#1d2a1f", "#5fae6a"], "M": ["#3d464d", "#4d5860"], "*": ["#3d464d", "#e2c35a"],
  "H": ["#2b3238", "#6f8fa0"], "Q": ["#22292e", "#4fd1c5"], "#": ["#1b2024", "#a0703f"], "%": ["#1b2024", "#8e9aa3"],
  "+": ["#1b2024", "#c08a4a"], "^": ["#1b2024", "#ff8a3d"], "&": ["#1b2024", "#c9a36a"], "?": ["#1b2024", "#e7d3a1"],
  "!": ["#1b2024", "#e5534b"], "x": ["#3a1a0d", "#ffb347"], "\"": ["#1d2a1f", "#7fbf6a"], "w": ["#1d2a1f", "#d8c25a"],
  "t": ["#1b2024", "#4a3a30"], "C": ["#1b2024", "#b98b4e"],
};
const NAMES = {"~":"coolant",":":"grating",".":"moss",",":"deck","o":"breach","_":"plating","'":"slag","=":"void",
  "T":"scrap heap","b":"lichen","M":"structure","*":"core node","H":"conduit","Q":"terminal","#":"scrap wall",
  "%":"alloy wall","+":"hatch","^":"heater","&":"bench","?":"sign","!":"beacon","x":"fire","\"":"spore bed",
  "w":"ripe bed","t":"debris","C":"locker"};
const ENT = {agent:"#f2f5f7", skitter:"#c7b28b", sentinel:"#e5534b", accretor:"#4fd1c5"};

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const view = document.getElementById("view");
let TS = 14;                         // tile size in px
let cam = {x: 0, y: 0};              // tile at the centre of the screen
let follow = null;                   // agent name to follow
let region = null, agents = [], metrics = {};
let me = null, meObs = null;
const qs = new URLSearchParams(location.search);
const wsBase = (location.protocol === "https:" ? "wss://" : "ws://") + location.host;

function resize() {
  cv.width = view.clientWidth * devicePixelRatio; cv.height = view.clientHeight * devicePixelRatio;
  cv.style.width = view.clientWidth + "px"; cv.style.height = view.clientHeight + "px";
}
addEventListener("resize", resize); resize();

// ---------------------------------------------------------------- spectator socket
let spec, reqId = 0;
function connectSpec() {
  spec = new WebSocket(wsBase + "/spectate");
  spec.onmessage = (m) => {
    const d = JSON.parse(m.data);
    if (d.type === "event") logEvent(d);
    else if (d.type === "reply") {
      if (d.rows) region = d;
      else if (d.agents) { agents = d.agents; drawAgents(); }
      else if (d.tick !== undefined && d.tick_ms_p50 !== undefined) metrics = d;
    }
  };
  spec.onclose = () => setTimeout(connectSpec, 1000);
}
connectSpec();
const send = (o) => spec.readyState === 1 && spec.send(JSON.stringify({...o, id: ++reqId}));

function viewTiles() {
  return [Math.ceil(cv.width / devicePixelRatio / TS) + 2, Math.ceil(cv.height / devicePixelRatio / TS) + 2];
}
setInterval(() => {
  if (follow) { const a = agents.find(a => a.name === follow); if (a) { cam.x = a.x; cam.y = a.y; } }
  if (me && meObs) { cam.x = meObs.self.x; cam.y = meObs.self.y; }
  const [w, h] = viewTiles();
  send({op: "region", x: Math.round(cam.x - w / 2), y: Math.round(cam.y - h / 2), w, h});
}, 200);
setInterval(() => { send({op: "agents"}); send({op: "metrics"}); }, 1000);

// ---------------------------------------------------------------- render
function draw() {
  requestAnimationFrame(draw);
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!region) return;
  const W = cv.width / devicePixelRatio, H = cv.height / devicePixelRatio;
  const ox = W / 2 - (cam.x - region.x) * TS - TS / 2, oy = H / 2 - (cam.y - region.y) * TS - TS / 2;
  const t = performance.now() / 1000;
  region.rows.forEach((row, j) => {
    for (let i = 0; i < row.length; i++) {
      const ch = row[i], [bg, fg] = COLORS[ch] || ["#111", "#f0f"];
      const px = ox + i * TS, py = oy + j * TS;
      ctx.fillStyle = bg; ctx.fillRect(px, py, TS, TS);
      if (ch === "~") { ctx.fillStyle = `rgba(79,209,197,${0.08 + 0.06 * Math.sin(t * 2 + i * .7 + j * .4)})`; ctx.fillRect(px, py, TS, TS); }
      if (!fg) continue;
      ctx.fillStyle = fg;
      const s = TS;
      switch (ch) {
        case "M": case "%": ctx.fillRect(px, py, s, s); ctx.fillStyle = "#00000040"; ctx.fillRect(px, py + s - 2, s, 2); ctx.fillRect(px + s - 2, py, 2, s); break;
        case "#": ctx.fillRect(px + 1, py + 1, s - 2, s - 2); ctx.fillStyle = "#00000050"; ctx.fillRect(px + 1, py + s / 2, s - 2, 1); break;
        case "H": ctx.fillRect(px + s * .3, py, s * .4, s); ctx.fillRect(px, py + s * .3, s, s * .4); break;
        case ":": case "_": ctx.fillRect(px, py, s, 1); ctx.fillRect(px, py, 1, s); break;
        case "o": ctx.beginPath(); ctx.arc(px + s / 2, py + s / 2, s * .4, 0, 7); ctx.fill(); break;
        case "T": for (let k = 0; k < 3; k++) ctx.fillRect(px + 2 + k * 3, py + s - 4 - k * 3, s - 4 - k * 3, 3); break;
        case "b": case "\"": case "w": for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(px + s * (.25 + .5 * (k % 2)), py + s * (.25 + .5 * (k >> 1)), s * .16, 0, 7); ctx.fill(); } break;
        case "Q": ctx.fillRect(px + 2, py + 2, s - 4, s - 4); ctx.fillStyle = Math.sin(t * 3 + i + j) > 0 ? "#0b3b37" : "#081e1c"; ctx.fillRect(px + 4, py + 4, s - 8, s - 8); break;
        case "x": ctx.fillStyle = `hsl(${25 + 15 * Math.sin(t * 9 + i)},100%,${50 + 10 * Math.sin(t * 13 + j)}%)`; ctx.fillRect(px + 2, py + 2, s - 4, s - 4); break;
        case "*": ctx.fillStyle = "#3d464d"; ctx.fillRect(px, py, s, s); ctx.fillStyle = fg; ctx.fillRect(px + s * .35, py + s * .35, s * .3, s * .3); break;
        default: ctx.fillRect(px + s * .2, py + s * .2, s * .6, s * .6);
      }
    }
  });
  for (const e of region.entities) {
    const px = ox + (e.x - region.x) * TS + TS / 2, py = oy + (e.y - region.y) * TS + TS / 2;
    ctx.fillStyle = ENT[e.kind] || "#fff";
    if (e.kind === "accretor") {
      ctx.save(); ctx.translate(px, py); ctx.rotate(t);
      ctx.fillRect(-TS * .4, -TS * .4, TS * .8, TS * .8); ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(px, py, e.kind === "agent" ? TS * .42 : TS * .3, 0, 7); ctx.fill();
    }
    if (e.kind === "agent") {
      const mine = me && e.name === me;
      ctx.strokeStyle = mine ? "#4fd1c5" : (e.name === follow ? "#ffd479" : "#000"); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py, TS * .42, 0, 7); ctx.stroke();
      ctx.fillStyle = "#000a"; const w = ctx.measureText(e.name).width;
      ctx.fillRect(px - w / 2 - 3, py - TS - 10, w + 6, 13);
      ctx.fillStyle = mine ? "#4fd1c5" : "#e6edf3"; ctx.font = "11px ui-monospace, monospace"; ctx.textAlign = "center";
      ctx.fillText(e.name, px, py - TS); ctx.textAlign = "start";
    }
  }
  bubbles = bubbles.filter(b => t - b.t < 6);
  for (const b of bubbles) {
    const a = region.entities.find(e => e.kind === "agent" && e.name === b.name);
    if (!a) continue;
    const px = ox + (a.x - region.x) * TS + TS / 2, py = oy + (a.y - region.y) * TS - TS - 14;
    ctx.font = "12px ui-monospace, monospace"; const text = b.text.slice(0, 60), w = ctx.measureText(text).width;
    ctx.fillStyle = b.shout ? "#3a2c08ee" : "#0c1d2aee"; ctx.fillRect(px - w / 2 - 6, py - 14, w + 12, 18);
    ctx.fillStyle = b.shout ? "#ffd479" : "#9ad1ff"; ctx.textAlign = "center"; ctx.fillText(text, px, py); ctx.textAlign = "start";
  }
  document.getElementById("clock").textContent =
    `tick ${region.tick}` + (follow ? ` · following ${follow}` : "") + (me ? ` · playing as ${me}` : "") + `  ·  scroll = zoom, drag = pan`;
}
let bubbles = [];
requestAnimationFrame(draw);

// ---------------------------------------------------------------- side panels
function drawAgents() {
  const el = document.getElementById("agents");
  el.innerHTML = "";
  agents.sort((a, b) => (b.online - a.online) || a.name.localeCompare(b.name)).forEach(a => {
    const d = document.createElement("div");
    d.className = (a.name === follow ? "sel " : "") + (a.online ? "" : "off");
    const inv = Object.values(a.inventory).reduce((s, n) => s + n, 0);
    d.innerHTML = `<span>${a.online ? "●" : "○"} ${esc(a.name)} <span class="t">${esc(a.persona || "")}</span></span><span class="t">hp ${a.hp} · ${inv} items · ☠${a.deaths}</span>`;
    d.onclick = () => { follow = follow === a.name ? null : a.name; if (follow) { cam.x = a.x; cam.y = a.y; } drawAgents(); };
    el.appendChild(d);
  });
  const m = metrics;
  if (m.tick !== undefined) document.getElementById("metrics").textContent =
    `tick ${m.tick} · online ${m.agents_online}/${m.agents_total} · tiles changed ${m.tiles_changed} · crafts ${m.crafts} · ` +
    `trades ${m.trades} · chat ${m.chat} · deaths ${m.deaths} · tick p50 ${m.tick_ms_p50}ms · rss ${m.rss_peak_mb}MB`;
}
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

const SKIP = new Set(["tile", "pick_up", "drop", "chest"]);
function logEvent(e) {
  if (e.type === "say" || e.type === "shout") bubbles.push({name: e.from, text: e.text, t: performance.now() / 1000, shout: e.type === "shout"});
  if (SKIP.has(e.type)) return;
  let text;
  switch (e.type) {
    case "say": text = `${e.from}: "${e.text}"`; break;
    case "shout": text = `${e.from} SHOUTS: "${e.text}"`; break;
    case "death": text = `☠ ${e.name} died (${e.cause})`; break;
    case "attack": text = `${e.attacker} hits ${e.target} for ${e.damage}${e.weapon ? " with " + e.weapon : ""}`; break;
    case "give": text = `${e.from} gives ${fmt(e.items)} to ${e.to}`; break;
    case "craft": text = `${e.name} crafted ${fmt(e.made)}`; break;
    case "join": text = `${e.name} ${e.new ? "appeared for the first time" : "woke up"}`; break;
    case "leave": text = `${e.name} went dormant`; break;
    case "sign": text = `${e.by} wrote: "${e.text}"`; break;
    case "creature_died": text = `${e.kind} destroyed${e.by ? " by " + e.by : ""}`; break;
    default: text = e.type + " " + JSON.stringify(e);
  }
  const log = document.getElementById("log");
  const d = document.createElement("div");
  d.innerHTML = `<span class="t">${e.tick}</span><span class="${e.type}">${esc(text)}</span>`;
  d.style.cursor = "pointer"; d.onclick = () => { follow = null; cam.x = e.x; cam.y = e.y; };
  log.prepend(d);
  while (log.childElementCount > 300) log.lastChild.remove();
}
const fmt = (o) => Object.entries(o || {}).map(([k, v]) => `${v} ${k}`).join(", ");

// ---------------------------------------------------------------- pan / zoom / tooltip
let drag = null;
view.addEventListener("mousedown", (e) => { drag = {x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false}; view.classList.add("drag"); });
addEventListener("mouseup", (e) => {
  view.classList.remove("drag");
  if (drag && !drag.moved && me) { const p = tileAt(e); if (p) act("move_to", {x: p.x, y: p.y}); }
  drag = null;
});
addEventListener("mousemove", (e) => {
  if (drag) {
    const dx = (e.clientX - drag.x) / TS, dy = (e.clientY - drag.y) / TS;
    if (Math.abs(dx) + Math.abs(dy) > .5) { drag.moved = true; follow = null; }
    if (drag.moved && !me) { cam.x = drag.cx - dx; cam.y = drag.cy - dy; }
  }
  const p = tileAt(e), tip = document.getElementById("tip");
  if (!p || !region) { tip.style.display = "none"; return; }
  const ch = (region.rows[p.y - region.y] || "")[p.x - region.x];
  const ents = region.entities.filter(en => en.x === p.x && en.y === p.y).map(en => en.name || en.kind);
  tip.textContent = `(${p.x}, ${p.y}) ${NAMES[ch] || "?"}${ents.length ? " · " + ents.join(", ") : ""}`;
  tip.style.display = "block"; const r = view.getBoundingClientRect();
  tip.style.left = (e.clientX - r.left + 14) + "px"; tip.style.top = (e.clientY - r.top + 14) + "px";
});
view.addEventListener("wheel", (e) => { e.preventDefault(); TS = Math.max(4, Math.min(40, TS * (e.deltaY < 0 ? 1.15 : 0.87))); }, {passive: false});
function tileAt(e) {
  if (!region) return null;
  const r = view.getBoundingClientRect(), W = r.width, H = r.height;
  const fx = (e.clientX - r.left - W / 2) / TS + cam.x + .5, fy = (e.clientY - r.top - H / 2) / TS + cam.y + .5;
  if (e.clientX < r.left || e.clientX > r.right) return null;
  return {x: Math.floor(fx), y: Math.floor(fy)};
}

// ---------------------------------------------------------------- play
let agentWs = null, aid = 0, pending = {};
function joinGame(name) {
  const tokenKey = "megastructure-token-" + name;
  let token = localStorage.getItem(tokenKey);
  if (!token) { token = crypto.randomUUID(); localStorage.setItem(tokenKey, token); }
  agentWs = new WebSocket(wsBase + "/agent");
  agentWs.onopen = () => rpc("hello", {name, token, persona: "human"}).then(r => {
    if (!r.ok) { document.getElementById("result").textContent = r.error + ": " + r.detail; alertLogin(r); return; }
    me = r.agent.name; follow = null;
    document.getElementById("login").style.display = "none"; document.getElementById("play").style.display = "block";
    refresh();
  });
  agentWs.onmessage = (m) => { const d = JSON.parse(m.data); const p = pending[d.id]; if (p) { delete pending[d.id]; p(d); } };
  agentWs.onclose = () => { me = null; meObs = null; document.getElementById("login").style.display = "block"; document.getElementById("play").style.display = "none"; };
}
function alertLogin(r) { document.getElementById("name").placeholder = r.detail || r.error; }
function rpc(op, extra) {
  return new Promise(res => { const id = ++aid; pending[id] = res; agentWs.send(JSON.stringify({id, op, ...extra})); });
}
async function refresh() {
  if (!me) return;
  const r = await rpc("observe", {}); if (!r.ok) return;
  meObs = r.obs; const s = meObs.self;
  const bar = (v, c) => `<div class="bar"><i style="width:${v}%;background:${c}"></i></div>`;
  document.getElementById("me").innerHTML =
    `<b>${esc(s.name)}</b> at (${s.x}, ${s.y}) on ${esc(s.standing_on)} · ${esc(meObs.time)}\n` +
    `hp ${s.hp}${bar(s.hp, "#e5534b")}hunger ${s.hunger}${bar(s.hunger, "#e8a33d")}energy ${s.energy}${bar(s.energy, "#4fd1c5")}` +
    `inventory: ${esc(fmt(s.inventory) || "empty")}` + (s.action ? `\ndoing: ${s.action}` : "");
}
setInterval(refresh, 1000);
let busy = false;
async function act(tool, args) {
  if (!me) return;
  busy = true;
  const r = await rpc("act", {tool, args});
  busy = false;
  const res = document.getElementById("result");
  if (r.ok) {
    const c = r.result.changed || {}, extra = {...r.result}; delete extra.changed; delete extra.tool; delete extra.ticks; delete extra.status; delete extra.events;
    res.style.color = "var(--accent)";
    res.textContent = `${tool} ✓ ${c.inventory ? fmt(c.inventory) : ""} ${Object.keys(extra).length ? JSON.stringify(extra) : ""}`;
  } else if (r.error !== "interrupted") {
    res.style.color = "var(--warn)"; res.textContent = `${tool} ✗ ${r.error}: ${r.detail || ""}`;
  }
  refresh();
}
document.getElementById("join").onclick = () => { const n = document.getElementById("name").value.trim(); if (n) joinGame(n); };
document.getElementById("name").onkeydown = (e) => { if (e.key === "Enter") document.getElementById("join").click(); };
function runCmd() {
  const line = document.getElementById("cmd").value.trim(); if (!line) return;
  const parts = line.match(/(?:[^\s"]+|"[^"]*")+/g), tool = parts.shift(), args = {};
  for (const p of parts) { const [k, ...v] = p.split("="); let val = v.join("=").replace(/^"|"$/g, ""); args[k] = /^-?\d+$/.test(val) ? +val : val; }
  act(tool, args); document.getElementById("cmd").value = ""; document.getElementById("cmd").blur();
}
document.getElementById("send").onclick = runCmd;
document.getElementById("cmd").onkeydown = (e) => { if (e.key === "Enter") runCmd(); if (e.key === "Escape") e.target.blur(); e.stopPropagation(); };
const KEYDIR = {w:"N", arrowup:"N", s:"S", arrowdown:"S", a:"W", arrowleft:"W", d:"E", arrowright:"E"};
addEventListener("keydown", (e) => {
  if (!me || document.activeElement.tagName === "INPUT") return;
  const k = e.key.toLowerCase();
  if (KEYDIR[k]) { e.preventDefault(); act(e.shiftKey ? "dig" : "step", {dir: KEYDIR[k]}); }
  else if (k === "f") act("pick_up", {});
  else if (k === "r") act("rest", {});
  else if (k === "t") { e.preventDefault(); const c = document.getElementById("cmd"); c.value = 'say text="'; c.focus(); }
  else if (k === "enter") { e.preventDefault(); document.getElementById("cmd").focus(); }
});
if (qs.get("follow")) follow = qs.get("follow");
</script>
</body>
</html>
