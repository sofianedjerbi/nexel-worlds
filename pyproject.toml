[project]
name = "nexel-worlds"
version = "0.1.0"
description = "Nexel Worlds: a persistent, tile-based multiplayer sandbox for people and AI agents (server, simulation, web client)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "websockets>=17.4",
]

[project.optional-dependencies]
# tools/install_assets.py (the art) and the other picture tools
art = ["pillow>=11"]
# tools/build_audio.py (the sound effects) and music/
audio = ["numpy>=2", "soundfile>=0.14.0"]

[project.urls]
Repository = "https://github.com/sofianedjerbi/nexel-worlds"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "megastructure"          # the game's first name: the package keeps it

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-rerunfailures>=16.7",
    "pytest-xdist>=3.8.0",
    "soundfile>=0.14.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
# the end-to-end suite drives real Chrome against a fresh server and takes minutes: run it with `pytest -m e2e`
markers = ["e2e: plays the game in Chrome against a fresh server", "quick: one short e2e test a file, a minute in all (tests/e2e/README.md)",
           "realtime: an e2e test that measures the machine's own time: not on the tests' fast clock (tests/e2e/clock.py)"]
addopts = "-m 'not e2e' -n 6"
