[project]
name = "megastructure"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "mlx-lm>=0.32.2",
    "websockets>=17.4",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-rerunfailures>=16.7",
    "pytest-xdist>=3.8.0",
    "soundfile>=0.14.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
# the end-to-end suite drives real Chrome against a fresh server and takes minutes: run it with `pytest -m e2e`
markers = ["e2e: plays the game in Chrome against a fresh server", "quick: one short e2e test a file, a minute in all (tests/e2e/README.md)"]
addopts = "-m 'not e2e' -n 6"
