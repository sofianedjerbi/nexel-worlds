# temporary (#8): deep-room close-ups, never merged
name: deep-shots
on:
  push:
    branches: [fix/deep-room-walls]
jobs:
  at:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
      - run: uv sync
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers
      - env:
          E2E_CHROME_ARGS: --use-angle=vulkan --enable-features=Vulkan --ignore-gpu-blocklist
          FACES_OUT: ${{ runner.temp }}/faces
        run: uv run pytest -m e2e -n 0 -q tests/e2e/test_e2e_faces_shots.py -k deep 2>&1 | tail -8
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: faces
          path: ${{ runner.temp }}/faces
