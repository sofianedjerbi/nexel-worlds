# SAST and supply chain: CodeQL (Python, JavaScript), uv audit of the locked dependencies, gitleaks over
# the whole history, bandit on src/ (medium and up; not blocking yet, the count goes in the run's summary).
name: Security

on:
  pull_request:
  push:
    branches: [main]          # CodeQL compares a pull request with main's last analysis
  schedule:
    - cron: "27 5 * * 1"      # Mondays 05:27 UTC: new advisories for unchanged code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  audit:
    name: Dependency audit (uv audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      # every package in uv.lock (extras and dev group too, by default) against the OSV database
      - run: uv audit --frozen --preview-features audit

  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3     # .gitleaks.toml: the default rules, less known false positives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    name: SAST (bandit, medium+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: bandit -r src -ll (not blocking while it has findings; the count is in the summary)
        continue-on-error: true
        run: |
          uvx bandit@1.9.4 -r src -ll -q -f json -o bandit.json || true
          n=$(python3 -c "import json; print(len(json.load(open('bandit.json'))['results']))")
          echo "bandit: $n medium/high findings in src/" >> "$GITHUB_STEP_SUMMARY"
          uvx bandit@1.9.4 -r src -ll
