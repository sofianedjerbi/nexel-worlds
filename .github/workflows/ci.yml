# Lint, tests and commit messages, on every pull request and every push to main.
# Not blocking yet (continue-on-error, see the step names): ruff format, the ruff rules today's code breaks
# (the `ignore` list in pyproject.toml), prettier on the web client. Drop the flag once the format pass is in.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF: ruff@0.17.6
  PRETTIER: prettier@3.10.1

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: ruff check (blocking; the rules in pyproject.toml)
        run: uvx "$RUFF" check --output-format github .
      - name: ruff check, all the families' rules (not blocking; the debt)
        continue-on-error: true
        run: |
          # --select on the command line re-enables the rules pyproject.toml ignores (keep it the same list)
          uvx "$RUFF" check --select E,W,F,B,UP,SIM,I,C4,RUF,PIE,ASYNC --statistics . | tee ruff-debt.txt
          echo "ruff debt: $(tail -n 1 ruff-debt.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: ruff format --check (not blocking until the format pass)
        continue-on-error: true
        run: |
          uvx "$RUFF" format --check . > ruff-format.txt || { echo "ruff format: $(tail -n 1 ruff-format.txt)" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

  web:
    name: Lint (prettier, web client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: prettier --check (not blocking until the format pass)
        continue-on-error: true
        run: |
          npx --yes "$PRETTIER" --check "src/nexel_worlds/web/**/*.{js,mjs,css,html}" > prettier.txt 2>&1 \
            || { echo "prettier: $(tail -n 1 prettier.txt)" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

  tests:
    name: Tests (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run pytest tests -q --ignore=tests/e2e

  # The browser tests (tests/e2e): the game in real Chrome against a fresh server, here and never on the shared Mac.
  # A pull request runs the ones its changes ask for (tools/affected.py: the tests naming what it changed); main runs
  # them all, and all of them must pass. The files are dealt out to runners, about three files each (at most 16), one
  # test at a time on each: there is no GPU here, Chrome draws the land on the CPU, and two tests at once starve each
  # other. The tests that need the built sounds (not in git: tools/build_audio.py) skip here.
  e2e-plan:
    name: Browser tests to run
    # While they are optional (#47), a pull request runs them only with the label `e2e` (the fixes for #47): the twenty
    # runners are shared, and the browser jobs of every pull request held the quick checks queued behind them.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only "$BASE"...HEAD)
            files=$(python3 tools/affected.py $changed | grep '^tests/e2e/' || true)
          else
            files=$(ls tests/e2e/test_*.py)
          fi
          python3 - "$files" >> "$GITHUB_OUTPUT" <<'PY'
          import json, math, sys
          files = sorted(f for f in sys.argv[1].split() if f)
          n = min(16, math.ceil(len(files) / 3))
          shards = [" ".join(files[i::n]) for i in range(n)]
          print("shards=" + json.dumps(shards))
          PY
          echo "browser test files: $(echo $files | wc -w)" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Browser tests
    needs: e2e-plan
    # Optional for now (the owner, 2026-11-25): the suite's old failures on these runners held every merge. The agents
    # make it pass (#47); then this line goes and the browser tests are mandatory again.
    continue-on-error: true
    if: needs.e2e-plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        files: ${{ fromJSON(needs.e2e-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: The game in Chrome (the runner's own Google Chrome)
        env:
          FILES: ${{ matrix.files }}
        run: uv run pytest -m e2e -n 0 -q --durations=10 $FILES

  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock @commitlint/cli@21 @commitlint/config-conventional@21
      - name: commitlint (the pull request's commits, or the pushed range)
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            npx commitlint --from "$BASE" --to "$HEAD" --verbose
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            npx commitlint --from "$BEFORE" --to "$AFTER" --verbose
          else
            # a new branch or a force-push: no old head to start from, the last commit only
            npx commitlint --last --verbose
          fi
