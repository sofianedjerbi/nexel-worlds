# Lint, tests and commit messages, on every pull request and every push to main.
# Not blocking yet (continue-on-error, see the step names): ruff format, the ruff rules today's code breaks
# (the `ignore` list in pyproject.toml), prettier on the web client. Drop the flag once the format pass is in.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # a pull request: only its newest run. main: a run in progress always finishes, and of those waiting only the newest
  # starts after it (it has every commit before it). (What kept main's full run waiting was runners, not this: a pull
  # request now takes 4 at most, #47)
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUFF: ruff@0.17.6
  PRETTIER: prettier@3.10.1
  ESLINT: eslint@9.39.5
  GLOBALS: globals@16.5.0

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: ruff check (blocking; the rules in pyproject.toml)
        run: uvx "$RUFF" check --output-format github .
      - name: ruff check, all the families' rules (not blocking; the debt)
        continue-on-error: true
        run: |
          # --select on the command line re-enables the rules pyproject.toml ignores (keep it the same list)
          uvx "$RUFF" check --select E,W,F,B,UP,SIM,I,C4,RUF,PIE,ASYNC --statistics . | tee ruff-debt.txt
          echo "ruff debt: $(tail -n 1 ruff-debt.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: ruff format --check (not blocking until the format pass)
        continue-on-error: true
        run: |
          uvx "$RUFF" format --check . > ruff-format.txt || { echo "ruff format: $(tail -n 1 ruff-format.txt)" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

  web:
    name: Lint (prettier, web client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # every name the web client reads is defined somewhere: a split that leaves one behind fails here (#174, #158)
      - name: no undefined names (tools/undef_check.mjs, ESLint no-undef over the page's scripts)
        run: npm install --no-save --no-package-lock "$ESLINT" "$GLOBALS" && node tools/undef_check.mjs
      - name: prettier --check (not blocking until the format pass)
        continue-on-error: true
        run: |
          npx --yes "$PRETTIER" --check "src/nexel_worlds/web/**/*.{js,mjs,css,html}" > prettier.txt 2>&1 \
            || { echo "prettier: $(tail -n 1 prettier.txt)" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

  tests:
    name: Tests (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run pytest tests -q --ignore=tests/e2e

  # The browser tests (tests/e2e): the game in real Chrome against a fresh server, here and never on the shared Mac.
  # A pull request runs the ones its changes ask for (tools/affected.py: the tests naming what it changed); main runs
  # them all, and all of them must pass. The files are dealt out to runners by how long each takes (tools/e2e_shards.py,
  # tests/e2e/durations.json: about five minutes of tests a runner, at most 16), one test at a time on each: there is
  # no GPU here, Chrome draws the land on the CPU, and two tests at once starve each other. The tests that need the
  # built sounds (not in git: tools/build_audio.py) skip here.
  e2e-plan:
    name: Browser tests to run
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only "$BASE"...HEAD)
            files=$(python3 tools/affected.py $changed | grep '^tests/e2e/' || true)
            # a change to how the browser tests are dealt out is checked on all of them: its measure is the full run
            if echo "$changed" | grep -qxE '\.github/workflows/ci\.yml|tools/e2e_shards\.py|tests/e2e/durations\.json'; then
              files=$(ls tests/e2e/test_*.py)
            fi
          else
            files=$(ls tests/e2e/test_*.py)
          fi
          echo "shards=$(python3 tools/e2e_shards.py plan $files)" >> "$GITHUB_OUTPUT"
          echo "browser test files: $(echo $files | wc -w)" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Browser tests
    needs: e2e-plan
    if: needs.e2e-plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # a pull request takes 4 of the 20 runners at most, main its 16: with every pull request's jobs at once, main's
      # full run waited behind ~110 jobs (#47)
      max-parallel: ${{ github.event_name == 'pull_request' && 4 || 16 }}
      matrix:
        files: ${{ fromJSON(needs.e2e-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # Chrome draws the land with Mesa's lavapipe (Vulkan on the CPU, LLVM) and not its own SwiftShader: 3 to 6 times
      # faster here (#47: loading, edits and hd_keepup took 137-240 s, 570-811 s on SwiftShader; edits passed only on it).
      # Mesa's GL driver through ANGLE (--use-angle=gl-egl) did not take: Chrome fell back to SwiftShader. The run's last
      # line names the renderer it got (tests/e2e/conftest.py).
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers
      # The sounds, so the sound tests run instead of skipping (#47). The effects are numpy, made here; the music is cut
      # from the renders game.yml keeps (the same cache, only read: nothing is played on Surge in this job). With no
      # renders cached, the effects are still built and the music's tests skip on their own ("no music rendered").
      - name: The music's renders, the last ones kept (game.yml's cache, read only)
        uses: actions/cache/restore@v6.1.0
        with:
          path: music/site/audio
          key: music-${{ hashFiles('music/*.py', 'music/*.json', '!music/sfx*') }}
          restore-keys: music-
      - name: The game's sounds (tools/build_audio.py)
        run: |
          ls music/site/audio/final_*.wav 2>/dev/null | wc -l | xargs echo "music renders cached:" >> "$GITHUB_STEP_SUMMARY"
          uv run --extra audio python tools/build_audio.py
      - name: The game in Chrome (the runner's own Google Chrome)
        env:
          FILES: ${{ matrix.files }}
          E2E_CHROME_ARGS: --use-angle=vulkan --enable-features=Vulkan --ignore-gpu-blocklist
          E2E_SHOTS: ${{ runner.temp }}/shots
        # -v: each test's end is a line of the log, with its time (a test that hangs is the one after the last line);
        # --durations=0: every test's time, what tools/e2e_shards.py measure reads into tests/e2e/durations.json;
        # --timeout: a test that hangs fails in five minutes with where it was, not at the job's 45
        run: uv run pytest -m e2e -n 0 -v --durations=0 --timeout=300 $FILES
      # each failing test's last picture (tests/e2e/pages.py), one artifact a runner
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-shots-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock @commitlint/cli@21 @commitlint/config-conventional@21
      - name: commitlint (the pull request's commits, or the pushed range)
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            npx commitlint --from "$BASE" --to "$HEAD" --verbose
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            npx commitlint --from "$BEFORE" --to "$AFTER" --verbose
          else
            # a new branch or a force-push: no old head to start from, the last commit only
            npx commitlint --last --verbose
          fi
