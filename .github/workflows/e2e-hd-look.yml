# TEMPORARY (#47): the HD-look browser tests on lavapipe, all of them, for the list of what fails. Removed before the PR is merged.
name: E2E HD-look list
on:
  push:
    branches: [test/e2e-hd-look]
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import glob, json
          files = sorted(glob.glob("tests/e2e/test_e2e_hd.py") + glob.glob("tests/e2e/test_e2e_hd_*.py"))
          n = 13
          print("shards=" + json.dumps([" ".join(files[i::n]) for i in range(n)]))
          PY
  hd:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        files: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers
      - env:
          FILES: ${{ matrix.files }}
          E2E_CHROME_ARGS: --use-angle=vulkan --enable-features=Vulkan --ignore-gpu-blocklist
          E2E_SHOTS: ${{ runner.temp }}/shots
        run: uv run pytest -m e2e -n 0 -q -rf --durations=0 $FILES
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-shots-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
