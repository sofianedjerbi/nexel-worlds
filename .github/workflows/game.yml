# The game, built from its sources (tools/build_game.sh): the instruments fetched, every piece of music played on them
# and on Surge XT, mastered, the sound effects rendered, then the in-browser build. Kept as the artifact "game"; the
# website (sofianedjerbi/nexel-website, its pages.yml) takes the latest one and serves it under play/.
# Monthly too, so that a build is always there within the artifacts' 90 days.
name: Game

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

# a build in progress is finished, not cancelled by the next push (a music render is long: pushes minutes apart would
# never let one end); the newest push waits, any older waiting one is dropped
concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the game from source
    runs-on: ubuntu-latest
    timeout-minutes: 150                 # (a full render of the music, about 50 minutes, only when its sources change)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
      - name: Surge XT (the synth the music is played on; the same 1.3.4 as on the Mac), and 7z
        run: |
          curl -fsSL -o surge.deb https://github.com/surge-synthesizer/releases-xt/releases/download/1.3.4/surge-xt-linux-x64-1.3.4.deb
          sudo apt-get update -q
          sudo apt-get install -y -q ./surge.deb p7zip-full
      # the music's renders, kept under the stamp of what makes them (tools/build_game.sh): a push that does not touch the
      # music's scripts or data plays the last renders again and skips the half hour of rendering
      - name: The music's renders, if its sources have not changed
        id: music
        uses: actions/cache@v6.1.0
        with:
          path: music/site/audio
          key: music-${{ hashFiles('music/*.py', 'music/*.json', '!music/sfx*') }}
      - name: The recorded instruments (600 MB, fetched once; only needed to render)
        if: steps.music.outputs.cache-hit != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: music/samples
          key: samples-${{ hashFiles('music/fetch_samples.py', 'music/sampler.py') }}
      - name: The game, from its sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh tools/build_game.sh dist             # (no display: Surge plays headless; under xvfb its plugin dies on X errors)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: game
          path: dist
          retention-days: 90
