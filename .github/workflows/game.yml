# The game, built from its sources (tools/build_game.sh): the instruments fetched, every piece of music played on them
# and on Surge XT, mastered, the sound effects rendered, then the in-browser build. Kept as the artifact "game"; the
# website (sofianedjerbi/nexel-website, its pages.yml) takes the latest one and serves it under play/.
# Monthly too, so that a build is always there within the artifacts' 90 days.
name: Game

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the game from source
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
      - name: Surge XT (the synth the music is played on; the same 1.3.4 as on the Mac), 7z, a display for its plugin
        run: |
          curl -fsSL -o surge.deb https://github.com/surge-synthesizer/releases-xt/releases/download/1.3.4/surge-xt-linux-x64-1.3.4.deb
          sudo apt-get update -q
          sudo apt-get install -y -q ./surge.deb p7zip-full xvfb
      - name: The recorded instruments (600 MB, fetched once)
        uses: actions/cache@v6.1.0
        with:
          path: music/samples
          key: samples-${{ hashFiles('music/fetch_samples.py', 'music/sampler.py') }}
      - name: The game, from its sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: xvfb-run -a sh tools/build_game.sh dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: game
          path: dist
          retention-days: 90
