# Only when asked: push the tag `release` on the commit to ship (git tag -f release && git push -f origin release),
# or run it from the Actions tab. A push to main alone releases nothing.
# python-semantic-release reads the Conventional Commits since the last tag vX.Y.Z
# and, when one of them calls for a release (feat: minor, fix/perf: patch while the version is 0.x), bumps
# project.version in pyproject.toml (and uv.lock), adds the release to CHANGELOG.md, commits that as
# `chore(release): vX.Y.Z`, tags it vX.Y.Z, pushes both and makes the GitHub Release with the notes.
# release.yml then builds the sdist and wheel onto that release (called from here: a tag pushed with
# GITHUB_TOKEN does not start other workflows; with a RELEASE_TOKEN secret the tag push starts it too).
# Config: [tool.semantic_release] in pyproject.toml.
name: Semantic release

on:
  push:
    tags: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  version:
    name: Next version, changelog, tag, GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.psr.outputs.released }}
      tag: ${{ steps.psr.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          # a fine-grained token (contents: write) when main is protected; else the workflow's own
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Release exactly the tagged commit, main's newest
        run: |
          [ "$GITHUB_SHA" = "$(git rev-parse origin/main)" ] || { echo "tag main's newest commit: the release commit is pushed onto main"; exit 1; }
          git reset --hard "$GITHUB_SHA"
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - id: psr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GIT_COMMIT_AUTHOR: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          uvx --from python-semantic-release==10.7.0 semantic-release -v version
          after=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$after" ] && [ "$after" != "$before" ]; then
            { echo "released=true"; echo "tag=$after"; } >> "$GITHUB_OUTPUT"
            echo "released $after" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "no release: no feat/fix/perf commit since $before" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: The trigger tag is used up
        if: github.ref == 'refs/tags/release'
        run: git push origin :refs/tags/release

  assets:
    name: Build and attach
    needs: version
    if: needs.version.outputs.released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
