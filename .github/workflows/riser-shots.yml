# temporary (#4): riser close-ups, main against this branch, never merged
name: riser-shots
on:
  push:
    branches: [fix/riser-own-rock]
jobs:
  at:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ref: [branch, efd4b25b]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          git show ${{ github.sha }}:tests/e2e/test_e2e_faces_shots.py > /tmp/s.py
          if [ "${{ matrix.ref }}" != branch ]; then git checkout -q ${{ matrix.ref }}; fi
          cp /tmp/s.py tests/e2e/test_e2e_faces_shots.py
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
      - run: uv sync
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers
      - env:
          E2E_CHROME_ARGS: --use-angle=vulkan --enable-features=Vulkan --ignore-gpu-blocklist
          FACES_OUT: ${{ runner.temp }}/faces
        run: uv run pytest -m e2e -n 0 -q tests/e2e/test_e2e_faces_shots.py -k riser 2>&1 | tail -5
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: faces-${{ matrix.ref }}
          path: ${{ runner.temp }}/faces
