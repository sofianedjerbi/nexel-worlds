# temporary (#4): measure the face colours once, never merged
name: probe-faces
on:
  push:
    branches: [test/face-kinds]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
      - run: uv sync
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers
      - env:
          E2E_CHROME_ARGS: --use-angle=vulkan --enable-features=Vulkan --ignore-gpu-blocklist
          E2E_SHOTS: ${{ runner.temp }}/shots
        run: uv run pytest -m e2e -n 0 -q tests/e2e/test_e2e_hd_faces.py 2>&1 | grep -E "^E  |passed|failed" | cut -c1-300 || true
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
